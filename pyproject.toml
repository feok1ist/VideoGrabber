[project]
name = "videograbber"
version = "0.1.0"
description = "Video downloader — wraps yt-dlp with a Flask web UI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
strict = false
disable_error_code = ["call-overload", "arg-type", "union-attr"]
